[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pill-ai"
version = "0.1.0"
description = "Ultra-cheap multi-agent computer-use AI — fork of Open Interpreter + LangGraph"
readme = "README.md"
license = { text = "BSL-1.1" }
requires-python = ">=3.10"
authors = [
    { name = "pill.ai", email = "hello@pill.ai" }
]
keywords = ["ai", "agent", "computer-use", "langgraph", "deepseek", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM routing
    "litellm>=1.40.0",
    # Multi-agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    # Browser
    "playwright>=1.44.0",
    # Desktop control
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "Pillow>=10.0.0",
    # System tray + global hotkey
    "pystray>=0.19.0",
    "keyboard>=0.13.5",
    # License server (only needed when hosting)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Utils
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
]
dashboard = [
    "streamlit>=1.35.0",
    "gradio>=4.36.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pillai = "pill_ai.cli:main"

[project.urls]
Homepage = "https://pill.ai"
Repository = "https://github.com/vilarkptl-lang/pill.ai"
Issues = "https://github.com/vilarkptl-lang/pill.ai/issues"
Pricing = "https://pill.ai/pricing"

[tool.hatch.build.targets.wheel]
packages = ["interpreter", "agents", "licensing", "dashboard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
