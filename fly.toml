app = "pill-ai-licensing"
primary_region = "mia"

[build]
  dockerfile = "licensing/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  max_machines = 1   # SQLite no soporta escrituras concurrentes entre máquinas

[mounts]
  source = "licensing_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
