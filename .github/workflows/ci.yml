name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[ci]" --no-deps
          pip install -e ".[ci]"

      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501

      - name: Type check (pyright, optional)
        run: pyright --pythonversion 3.12 || true

      - name: Tests
        env:
          PILLAI_LICENSE_KEY: ""     # run in local free mode during CI
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pytest tests/ -v --cov=interpreter --cov=licensing --cov-report=term-missing -x

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build license server image
        run: docker build -f licensing/Dockerfile -t pill-ai-licensing:ci .
