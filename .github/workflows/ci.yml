name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e . --no-deps
          pip install \
            "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" "httpx>=0.27.0" \
            "sqlalchemy>=2.0.0" "litellm>=1.40.0" \
            "langgraph>=0.2.0" "langchain-core>=0.2.0" \
            "pydantic>=2.7.0" "python-dotenv>=1.0.0" "rich>=13.7.0" \
            "pytest>=8.0.0" "pytest-cov>=5.0.0" "ruff>=0.4.0"

      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501

      - name: Type check (pyright, optional)
        run: pyright --pythonversion 3.12 || true

      - name: Tests
        env:
          PILLAI_LICENSE_KEY: ""     # run in local free mode during CI
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: pytest tests/ -v --cov=interpreter --cov=licensing --cov-report=term-missing -x

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build license server image
        run: docker build -f licensing/Dockerfile -t pill-ai-licensing:ci .
